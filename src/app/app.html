<div class="container">
  <h1>{{ title }}</h1>

  <hr>

  <h2>Teendők Listája</h2>

  <ul class="todo-list">
    <li *ngFor="let todo of todos" class="todo-item">
      
      <input type="checkbox" [checked]="todo.isComplete" disabled>

      <span>{{ todo.name }}</span>

      <button (click)="deleteTodo(todo.id)" class="btn-delete">Törlés</button>
    </li>
  </ul>

  <router-outlet></router-outlet>
</div>
