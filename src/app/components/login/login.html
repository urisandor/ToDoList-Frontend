<div class="form-container">
  <h2>Bejelentkezés</h2>
  
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="email">Email cím:</label>
      <input id="email" type="email" formControlName="email">
      <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="error">
        Érvényes email cím kötelező.
      </div>
    </div>

    <div class="form-group">
      <label for="password">Jelszó:</label>
      <input id="password" type="password" formControlName="password">
      <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="error">
        A jelszó kötelező.
      </div>
    </div>

    <div *ngIf="errorMessage" class="error api-error">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="loginForm.invalid">Bejelentkezés</button>
  </form>

  <p class="toggle-link">
    Még nincs fiókod? <a href="/register">Regisztrálj most!</a>
  </p>
</div>
