<div class="form-container">
  <h2>Regisztráció</h2>
  
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="username">Felhasználónév:</label>
      <input id="username" type="text" formControlName="username">
      <div *ngIf="registerForm.get('username')?.touched && registerForm.get('username')?.invalid" class="error">
        A felhasználónév kötelező.
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email cím:</label>
      <input id="email" type="email" formControlName="email">
      <div *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid" class="error">
        Érvényes email cím kötelező.
      </div>
    </div>

    <div class="form-group">
      <label for="password">Jelszó:</label>
      <input id="password" type="password" formControlName="password">
      <div *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid" class="error">
        A jelszó kötelező (minimum 6 karakter).
      </div>
    </div>

    <div *ngIf="errorMessage" class="error api-error">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="registerForm.invalid">Regisztráció</button>
  </form>

  <p class="toggle-link">
    Már van fiókod? <a href="/login">Jelentkezz be!</a>
  </p>
</div>
